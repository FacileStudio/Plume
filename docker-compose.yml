services:
  plume-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plume}
    volumes:
    - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  plume-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
    - '4000'
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '4000'
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
    - default
    - dokploy-network
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.plume-web.rule: Host(`plume.facile.studio`)
      traefik.http.routers.plume-web.entrypoints: web
      traefik.http.routers.plume-web.middlewares: redirect-to-https@file
      traefik.http.routers.plume-web.service: plume-svc
      traefik.http.routers.plume-secure.rule: Host(`plume.facile.studio`)
      traefik.http.routers.plume-secure.entrypoints: websecure
      traefik.http.routers.plume-secure.tls.certresolver: letsencrypt
      traefik.http.routers.plume-secure.service: plume-svc
      traefik.http.services.plume-svc.loadbalancer.server.port: '4000'
    environment:
      APP_ENV: ${APP_ENV:-production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PORT: '4000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://postgres:postgres@plume-db:5432/plume?sslmode=disable
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      DOMAIN: ${DOMAIN:-http://localhost:4000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      SSO_ONLY: ${SSO_ONLY:-false}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
    volumes:
    - uploads_data:/data/uploads
    depends_on:
      plume-db:
        condition: service_healthy
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  db_data:
    name: plume_db_data
  uploads_data:
    name: plume_uploads
networks:
  dokploy-network:
    external: true
  default:
    ipam:
      config:
      - subnet: 172.16.0.0/24
